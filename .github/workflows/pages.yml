name: Validate and deploy EFGC Youth App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "efgc-youth-pages-v81"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build V74 local visual assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python scripts/build-v74-assets.py

      - name: Validate JavaScript and app shell
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check v60-auth-adapter.js
          node --check v60-no-email-auth.js
          node --check v22-live-data.js
          node --check v23-photo-security.js
          node --check v43-ministry-tools.js
          node --check v44-updates.js
          node --check v45-theme.js
          node --check v54-stable-welcome.js
          node --check v62-notifications.js
          node --check v68-scripture-generator.js
          node --check v74-brand.js
          node --check v75-roster-multi.js
          node --check notification-sw.js

          test -f index.html
          test -f manifest.webmanifest
          test -f v74-brand.css
          test -f v74-brand.js
          test -f v75-roster-multi.js
          test -f v75-roster-multi.css
          test -f assets/v76-login-poster.webp
          test -f assets/v76-efgc-logo.png
          test -d assets/scripture-v74

          test $(stat -c%s assets/v76-login-poster.webp) -gt 10000
          test $(stat -c%s assets/v76-efgc-logo.png) -gt 5000
          test $(find assets/scripture-v74 -maxdepth 1 -name '*.jpg' | wc -l) -ge 12

          grep -q 'window.EFGC_V74_ACTIVE=true' index.html
          grep -q 'v74-brand.css?v=81.0' index.html
          grep -q 'v74-brand.js?v=81.0' index.html
          grep -q 'v75-roster-multi.js?v=76.0' index.html
          grep -q 'v75-roster-multi.css?v=76.0' index.html
          grep -q 'v68-scripture-generator.js?v=79.0' index.html
          grep -q 'v68-scripture-generator.css?v=79.0' index.html
          grep -q 'v45-theme.js?v=76.0' index.html
          grep -q 'v54-stable-welcome.js?v=76.0' index.html
          grep -q 'assets/v76-efgc-logo.png?v=76.0' index.html
          grep -q 'assets/v76-efgc-logo.png?v=76.0' manifest.webmanifest

          grep -q 'EFGC_V74_ACTIVE' v74-brand.js
          grep -q 'v74LoginButton' v74-brand.js
          grep -q 'syncWelcomeViewport' v74-brand.js
          grep -q 'placeHitbox' v74-brand.js
          grep -q "welcome.style.setProperty('display','none','important')" v74-brand.js
          grep -q "welcome.style.setProperty('pointer-events','none','important')" v74-brand.js
          grep -q "openForm('signin')" v74-brand.js
          grep -q "openForm('register')" v74-brand.js
          grep -q "position:fixed" v74-brand.css
          grep -q 'v74CreateButton' v74-brand.js
          grep -q 'assets/v76-login-poster.webp?v=81.0' v74-brand.js
          grep -q 'assets/v76-efgc-logo.png?v=81.0' v74-brand.js

          grep -q 'assets/v76-efgc-logo.png?v=76.0' v45-theme.js
          grep -q 'EFGC_V74_ACTIVE' v45-theme.js
          grep -q 'EFGC_V74_ACTIVE' v54-stable-welcome.js

          grep -q 'Daily Scripture Generator' v68-scripture-generator.js
          grep -q 'assets/scripture-v74/' v68-scripture-generator.js
          grep -q 'assets/v76-efgc-logo.png?v=81.0' v68-scripture-generator.js
          grep -q 'waitForPosterReady' v68-scripture-generator.js
          grep -q 'saveRosterWeekV75' v75-roster-multi.js
          grep -q 'canvasToBlob' v68-scripture-generator.js
          grep -q 'nextPaint' v68-scripture-generator.js
          grep -q 'SCRIPTURE_REMOTE_SOURCES' scripts/build-v74-assets.py
          test "$(grep -c 'https://images.pexels.com/photos/' scripts/build-v74-assets.py)" -ge 15
          grep -q "label:'Blue Worship'" v68-scripture-generator.js
          if grep -A 6 '^FALLBACK_SOURCES' scripts/build-v74-assets.py | grep -q 'login-poster'; then
            echo "Login poster must never be a Scripture background source."
            exit 1
          fi
          grep -q 'input type=\"checkbox\"' v75-roster-multi.js
          if grep -q 'https://unsplash.com/photos' v68-scripture-generator.js; then
            echo "Runtime Scripture generator must not depend on remote Unsplash images."
            exit 1
          fi

          if grep -q 'v73-brand.js' index.html || grep -q 'v73-brand.css' index.html; then
            echo "Broken V73 branding layer must not be loaded."
            exit 1
          fi
          if grep -q 'v61-smoke-login.js' index.html || grep -q 'v61-smoke-login.css' index.html; then
            echo "Smoke-test login assets must not be loaded by the live app."
            exit 1
          fi
          if grep -q 'v36-password-recovery.js' index.html || grep -q 'v21-auth-ui.js' index.html; then
            echo "Legacy email authentication scripts must not be loaded by the live app."
            exit 1
          fi
          if grep -R -E 'service_role|sb_secret_' --include='*.js' --include='*.html' .; then
            echo "Secret/service-role material must never be shipped to the browser."
            exit 1
          fi

      - name: Smoke-test static site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/efgc-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2

          curl --fail --silent --show-error http://127.0.0.1:8080/index.html -o /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/v74-brand.js -o /tmp/v74.js
          curl --fail --silent --show-error http://127.0.0.1:8080/v74-brand.css -o /tmp/v74.css
          curl --fail --silent --show-error http://127.0.0.1:8080/v68-scripture-generator.js -o /tmp/scripture.js
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/v76-login-poster.webp -o /tmp/login.webp
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/v76-efgc-logo.png -o /tmp/logo.png
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/scripture-v74/bible-light.jpg -o /tmp/bible.jpg
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/scripture-v74/youth-worship.jpg -o /tmp/worship.jpg

          grep -q 'EFGC YOUTH' /tmp/index.html
          grep -q 'v74LoginButton' /tmp/v74.js
          grep -q 'v74-poster-frame' /tmp/v74.css
          grep -q 'assets/scripture-v74/' /tmp/scripture.js
          test $(stat -c%s /tmp/login.webp) -gt 10000
          test $(stat -c%s /tmp/logo.png) -gt 5000
          test $(stat -c%s /tmp/bible.jpg) -gt 10000
          test $(stat -c%s /tmp/worship.jpg) -gt 10000

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build V74 local visual assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python scripts/build-v74-assets.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
