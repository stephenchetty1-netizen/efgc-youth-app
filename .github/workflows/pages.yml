name: Validate and deploy EFGC Youth App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "efgc-youth-pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate JavaScript and app shell
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check auth-adapter.js
          node --check v21-auth-ui.js
          node --check v22-live-data.js
          node --check v23-photo-security.js
          node --check v36-password-recovery.js
          node --check v43-ministry-tools.js
          node --check v44-updates.js
          node --check v45-theme.js
          node --check v50-reference-welcome.js
          node --check v53-exact-welcome.js
          test -f index.html
          test -f manifest.webmanifest
          test -f v43.css
          test -f v44.css
          test -f v45-theme.css
          test -f v49-vibrant.css
          test -f v50-reference-welcome.css
          test -f v53-exact-welcome.css
          test -f assets/v49-sunrise.webp
          test -f assets/v49-youth-fellowship.webp
          test -f assets/efgc-logo.svg
          test -f assets/efgc-home-hero.webp
          for asset in backend-adapter.js auth-adapter.js app.js v22-live-data.js v23-photo-security.js v36-password-recovery.js v21-auth-ui.js v43-ministry-tools.js v44-updates.js v45-theme.js v50-reference-welcome.js v53-exact-welcome.js v43.css v44.css v45-theme.css v50-reference-welcome.css v53-exact-welcome.css assets/efgc-logo.svg; do
            grep -q "$asset" index.html || { echo "Missing reference to $asset"; exit 1; }
          done
          grep -q 'Pass on the Baton' assets/efgc-logo.svg
          grep -q 'v53-exact-welcome' index.html
          grep -q 'data:image/webp;base64' v53-exact-welcome.js
          grep -q 'v53Login' v53-exact-welcome.js
          grep -q 'v53Create' v53-exact-welcome.js
          grep -q 'assets/efgc-home-hero.webp' v45-theme.js
          grep -q 'id="forgotPasswordButton"' index.html
          grep -q 'id="plannerMenu"' index.html
          grep -q 'id="attendanceMenu"' index.html
          grep -q 'id="plannerRosterHost"' index.html
          grep -q 'id="attendanceAdminHost"' index.html
          grep -q 'requestAdminPasswordReset' v36-password-recovery.js
          grep -q 'generateYearPlannerV44' v44-updates.js
          grep -q 'saveRosterWeekV44' v44-updates.js
          grep -q 'adminEventImage' v44-updates.js
          grep -q 'saveOwnLeaderProfile' v44-updates.js
          grep -q 'mock-welcome' v45-theme.js
          grep -q 'mock-dashboard' v45-theme.css
          grep -q 'mock-attendance' v45-theme.css
          if grep -q 'onclick="requestAdminPasswordReset' index.html; then
            echo "Admin recovery must have exactly one JavaScript binding to avoid duplicate reset emails."
            exit 1
          fi
          if grep -R -E 'service_role|sb_secret_' --include='*.js' --include='*.html' .; then
            echo "Secret/service-role material must never be shipped to the browser."
            exit 1
          fi

      - name: Smoke-test static site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/efgc-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/index.html | grep -q 'EFGC YOUTH'
          curl --fail --silent --show-error http://127.0.0.1:8080/v53-exact-welcome.js | grep -q 'V53'
          curl --fail --silent --show-error http://127.0.0.1:8080/v53-exact-welcome.css | grep -q 'approved artwork'
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/efgc-logo.svg | grep -q 'Pass on the Baton'
          curl --fail --silent --show-error http://127.0.0.1:8080/v36-password-recovery.js | grep -q 'requestAdminPasswordReset'

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
