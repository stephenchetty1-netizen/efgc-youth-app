name: Validate and deploy EFGC Youth V100

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: efgc-youth-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore and validate complete official EFGC images
        run: python3 scripts/restore-mobile-brand-assets.py

      - name: Download and validate six licensed Scripture photographs
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python3 scripts/prepare-scripture-photos.py

      - name: Decode EFGC artwork fully (not only check file size)
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for file in ("assets/v74-login-poster.webp","assets/v74-efgc-logo.webp"):
              with Image.open(file) as image:
                  image.load()
                  assert image.width >= 400 and image.height >= 400, (file,image.size)
                  print("DECODE PASS:",file,image.size,Path(file).stat().st_size,"bytes")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V100 source, logout privacy, manifest and safeguarding gates
        run: python3 scripts/validate-v87.py

      - name: Smoke-test static site and app entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/efgc-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null; then break; fi
            sleep 1
          done

          python3 - <<'PY'
          from pathlib import Path
          import struct
          for asset in ('assets/v74-login-poster.webp','assets/v74-efgc-logo.webp'):
              data=Path(asset).read_bytes()
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
              assert len(data)==8+struct.unpack_from('<I',data,4)[0]
              print('OK complete',asset,len(data),'bytes')
          PY
          for file in index.html manifest.webmanifest v68-scripture-generator.js v68-scripture-generator.css assets/scripture/dawn-cross.webp assets/scripture/prayer-bible.webp assets/scripture/mountain-cross.webp assets/scripture/blue-sky-cross.webp assets/scripture/morning-devotion.webp assets/scripture/chapel-dawn.webp v98-whatsapp-share.js v98-whatsapp-share.css v97-directory.js v97-directory.css v87-network.js v87-dashboard.js v87-ministry.js v87-admin.js v87.css v88-layout.js v88.css v91.css v92.css v93.css v94.css assets/v74-efgc-logo.webp assets/v74-login-poster.webp; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$file" -o /dev/null
            echo "OK $file"
          done


      - name: Verify actual Android-style mobile layout in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --retries 6 --timeout 180 "playwright==1.55.0"
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8081 >/tmp/efgc-v93-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8081/index.html >/dev/null; then break; fi
            sleep 1
          done
          EFGC_TEST_URL="http://127.0.0.1:8081/index.html?v=95" EFGC_SCREENSHOT_DIR="v100-qa" python3 scripts/test-v93-phone-layout.py
          EFGC_TEST_URL="http://127.0.0.1:8081/index.html?v=97" EFGC_SCREENSHOT_DIR="v100-qa" python3 scripts/test-v97-staff-directory.py
          EFGC_TEST_URL="http://127.0.0.1:8081/index.html?v=99" EFGC_SCREENSHOT_DIR="v100-qa" python3 scripts/test-v98-whatsapp-share.py
          EFGC_TEST_URL="http://127.0.0.1:8081/index.html?v=100" EFGC_SCREENSHOT_DIR="v100-qa" python3 scripts/test-v100-scripture-photos.py

      - name: Preserve visual smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EFGC-V100-Phone-Layout-Checks
          path: v100-qa/*.png
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4

      - name: Restore complete official EFGC images for Pages artifact
        run: python3 scripts/restore-mobile-brand-assets.py

      - name: Download and validate six Scripture photographs for the release
        run: python3 -m pip install --disable-pip-version-check "Pillow==11.3.0" && python3 scripts/prepare-scripture-photos.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload validated static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy EFGC Youth site
        id: deployment
        uses: actions/deploy-pages@v4
