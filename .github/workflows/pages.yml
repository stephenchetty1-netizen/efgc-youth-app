name: Validate and deploy EFGC Youth App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "efgc-youth-pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate JavaScript and app shell
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check auth-adapter.js
          node --check v21-auth-ui.js
          node --check v22-live-data.js
          node --check v23-photo-security.js
          node --check v36-password-recovery.js
          node --check v43-ministry-tools.js
          node --check v44-updates.js
          node --check v45-theme.js
          node --check v54-stable-welcome.js
          node --check tests/supabase-smoke.cjs
          node --check tests/visual-smoke.cjs
          test -f index.html
          test -f manifest.webmanifest
          test -f v43.css
          test -f v44.css
          test -f v45-theme.css
          test -f v49-vibrant.css
          test -f v54-stable-welcome.css
          test -f assets/v49-sunrise.webp
          test -f assets/v49-youth-fellowship.webp
          test -f assets/efgc-logo.svg
          test -f assets/efgc-youth-welcome.jpg
          test -f assets/efgc-home-hero.webp
          for asset in backend-adapter.js auth-adapter.js app.js v22-live-data.js v23-photo-security.js v36-password-recovery.js v21-auth-ui.js v43-ministry-tools.js v44-updates.js v45-theme.js v54-stable-welcome.js v43.css v44.css v45-theme.css v54-stable-welcome.css assets/efgc-logo.svg; do
            grep -q "$asset" index.html || { echo "Missing reference to $asset"; exit 1; }
          done
          grep -q 'Pass on the Baton' assets/efgc-logo.svg
          grep -q 'V62' v54-stable-welcome.js
          grep -q 'buildWelcome' v54-stable-welcome.js
          grep -q 'assets/efgc-logo.svg?v=62.0' v54-stable-welcome.js
          grep -q 'A generation for His glory' v54-stable-welcome.js
          grep -q 'v54-stable-welcome.js?v=62.0' index.html
          grep -q 'v54-stable-welcome.css?v=62.0' index.html
          grep -q 'manifest.webmanifest?v=62.0' index.html
          grep -q 'id="forgotPasswordButton"' index.html
          grep -q 'id="plannerMenu"' index.html
          grep -q 'id="attendanceMenu"' index.html
          grep -q 'id="plannerRosterHost"' index.html
          grep -q 'id="attendanceAdminHost"' index.html
          grep -q 'requestAdminPasswordReset' v36-password-recovery.js
          grep -q 'generateYearPlannerV44' v44-updates.js
          grep -q 'saveRosterWeekV44' v44-updates.js
          grep -q 'adminEventImage' v44-updates.js
          grep -q 'saveOwnLeaderProfile' v44-updates.js
          grep -q 'mock-dashboard' v45-theme.css
          grep -q 'mock-attendance' v45-theme.css
          if grep -q 'ensureWelcome' v45-theme.js; then
            echo "v45-theme.js must not create a second welcome renderer."
            exit 1
          fi
          if grep -q 'onclick="requestAdminPasswordReset' index.html; then
            echo "Admin recovery must have exactly one JavaScript binding to avoid duplicate reset emails."
            exit 1
          fi
          if grep -R -E 'service_role|sb_secret_' --include='*.js' --include='*.html' .; then
            echo "Secret/service-role material must never be shipped to the browser."
            exit 1
          fi

      - name: Smoke-test static site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/efgc-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/index.html | grep -q 'EFGC YOUTH'
          curl --fail --silent --show-error http://127.0.0.1:8080/v54-stable-welcome.js | grep -q 'V62'
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/efgc-logo.svg -o /tmp/efgc-logo.svg
          grep -q 'EMMANUEL FULL GOSPEL CHURCH' /tmp/efgc-logo.svg
          grep -q 'Pass on the Baton' /tmp/efgc-logo.svg
          curl --fail --silent --show-error http://127.0.0.1:8080/v36-password-recovery.js | grep -q 'requestAdminPasswordReset'

      - name: Check Supabase public connectivity without writing data
        shell: bash
        run: |
          set -euo pipefail
          node tests/supabase-smoke.cjs

      - name: Install Playwright for responsive UI checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run responsive welcome and Admin-login visual smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/efgc-visual-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2
          node tests/visual-smoke.cjs

      - name: Upload V62 responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v62-responsive-screenshots
          path: artifacts/v62-visual/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
