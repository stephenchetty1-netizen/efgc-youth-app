name: Validate and deploy EFGC Youth App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "efgc-youth-pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate JavaScript and app shell
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check v60-auth-adapter.js
          node --check v60-no-email-auth.js
          node --check v22-live-data.js
          node --check v23-photo-security.js
          node --check v43-ministry-tools.js
          node --check v44-updates.js
          node --check v45-theme.js
          node --check v54-stable-welcome.js
          node --check v62-notifications.js
          node --check v68-scripture-generator.js
          node --check notification-sw.js

          test -f index.html
          test -f manifest.webmanifest
          test -f v43.css
          test -f v44.css
          test -f v45-theme.css
          test -f v49-vibrant.css
          test -f v54-stable-welcome.css
          test -f v60-no-email.css
          test -f v62-notifications.css
          test -f v68-scripture-generator.css
          test -f v68-scripture-generator.js
          test -f notification-sw.js
          test -f assets/v49-sunrise.webp
          test -f assets/v49-youth-fellowship.webp
          test -f assets/efgc-logo.svg
          test -f assets/efgc-home-hero.webp

          for asset in backend-adapter.js v60-auth-adapter.js app.js v22-live-data.js v23-photo-security.js v60-no-email-auth.js v43-ministry-tools.js v44-updates.js v45-theme.js v54-stable-welcome.js v62-notifications.js v68-scripture-generator.js v43.css v44.css v45-theme.css v54-stable-welcome.css v60-no-email.css v62-notifications.css v68-scripture-generator.css assets/efgc-logo.svg; do
            grep -q "$asset" index.html || { echo "Missing reference to $asset"; exit 1; }
          done

          grep -q 'Pass on the Baton' assets/efgc-logo.svg
          grep -q 'buildWelcome' v54-stable-welcome.js
          grep -q 'A GENERATION FOR HIS GLORY' v54-stable-welcome.js
          grep -q 'v60-auth-adapter.js?v=60.0' index.html
          grep -q 'v60-no-email-auth.js?v=60.0' index.html
          grep -q 'v60-no-email.css?v=60.0' index.html
          grep -q 'v62-notifications.js?v=62.0' index.html
          grep -q 'v62-notifications.css?v=62.0' index.html
          grep -q 'v68-scripture-generator.js?v=69.0' index.html
          grep -q 'v68-scripture-generator.css?v=69.0' index.html
          grep -q 'Daily Scripture Generator' v68-scripture-generator.js
          grep -q 'scripturePosterCanvas' v68-scripture-generator.js
          grep -q 'Download Image' v68-scripture-generator.js
          grep -q 'THEME_SPECS' v68-scripture-generator.js
          grep -q 'Official EFGC logo' v68-scripture-generator.js
          grep -q 'notification-sw.js?v=62.0' v62-notifications.js
          grep -q 'news_posts' v62-notifications.js
          grep -q 'events?select=' v62-notifications.js
          grep -q 'Notification.requestPermission' v62-notifications.js
          grep -q 'showNotification' v62-notifications.js
          grep -q 'notificationclick' notification-sw.js
          grep -q 'id="plannerMenu"' index.html
          grep -q 'id="attendanceMenu"' index.html
          grep -q 'id="plannerRosterHost"' index.html
          grep -q 'id="attendanceAdminHost"' index.html
          grep -q 'member-auth' v60-no-email-auth.js
          grep -q 'action: .admin-login.' v60-no-email-auth.js
          grep -q 'action: .register.' v60-no-email-auth.js
          grep -q 'admin-reset-member-password' v60-no-email-auth.js
          grep -q 'member-password-reset' app.js
          grep -q 'member-reset-modal' v60-no-email.css
          grep -q 'generateYearPlannerV44' v44-updates.js
          grep -q 'saveRosterWeekV44' v44-updates.js
          grep -q 'adminEventImage' v44-updates.js
          grep -q 'saveOwnLeaderProfile' v44-updates.js
          grep -q 'mock-dashboard' v45-theme.css
          grep -q 'mock-attendance' v45-theme.css

          if grep -q 'v61-smoke-login.js' index.html || grep -q 'v61-smoke-login.css' index.html; then
            echo "Smoke-test login assets must not be loaded by the live app."
            exit 1
          fi
          if grep -q 'v36-password-recovery.js' index.html || grep -q 'v21-auth-ui.js' index.html; then
            echo "Legacy email authentication scripts must not be loaded by the live app."
            exit 1
          fi
          if grep -q 'requestAdminPasswordReset' index.html; then
            echo "Email password recovery must not be exposed in the live app."
            exit 1
          fi
          if grep -R -E 'service_role|sb_secret_' --include='*.js' --include='*.html' .; then
            echo "Secret/service-role material must never be shipped to the browser."
            exit 1
          fi

      - name: Smoke-test static site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/efgc-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 2

          curl --fail --silent --show-error http://127.0.0.1:8080/index.html -o /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:8080/v60-auth-adapter.js -o /tmp/auth.js
          curl --fail --silent --show-error http://127.0.0.1:8080/v60-no-email-auth.js -o /tmp/no-email.js
          curl --fail --silent --show-error http://127.0.0.1:8080/v62-notifications.js -o /tmp/notifications.js
          curl --fail --silent --show-error http://127.0.0.1:8080/v62-notifications.css -o /tmp/notifications.css
          curl --fail --silent --show-error http://127.0.0.1:8080/notification-sw.js -o /tmp/sw.js
          curl --fail --silent --show-error http://127.0.0.1:8080/app.js -o /tmp/app.js
          curl --fail --silent --show-error http://127.0.0.1:8080/v60-no-email.css -o /tmp/no-email.css
          curl --fail --silent --show-error http://127.0.0.1:8080/v68-scripture-generator.js -o /tmp/scripture.js
          curl --fail --silent --show-error http://127.0.0.1:8080/v68-scripture-generator.css -o /tmp/scripture.css
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/efgc-logo.svg -o /tmp/logo.svg

          grep -q 'EFGC YOUTH' /tmp/index.html
          grep -q 'no-email' /tmp/auth.js
          grep -q 'admin-reset-member-password' /tmp/no-email.js
          grep -q 'New EFGC Youth Post' /tmp/notifications.js
          grep -q 'efgc-notify-bell' /tmp/notifications.css
          grep -q 'notificationclick' /tmp/sw.js
          grep -q 'member-password-reset' /tmp/app.js
          grep -q 'member-reset-modal' /tmp/no-email.css
          grep -q 'Daily Scripture Generator' /tmp/scripture.js
          grep -q 'scripturePosterCanvas' /tmp/scripture.js
          grep -q 'scripture-generator-v68' /tmp/scripture.css
          grep -q 'EMMANUEL FULL GOSPEL CHURCH' /tmp/logo.svg
          grep -q 'Pass on the Baton' /tmp/logo.svg

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
