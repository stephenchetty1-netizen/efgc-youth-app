name: Validate and deploy EFGC Youth V87

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: efgc-youth-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate actual V87 source, manifest, security gates and committed visual assets
        run: python3 scripts/validate-v87.py

      - name: Smoke-test static site and app entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/efgc-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null; then break; fi
            sleep 1
          done

          for file in index.html manifest.webmanifest v87-network.js v87-dashboard.js v87-ministry.js v87-admin.js v87.css assets/v74-efgc-logo.webp assets/v74-login-poster.webp; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$file" -o /dev/null
            echo "OK $file"
          done

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload validated static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy EFGC Youth site
        id: deployment
        uses: actions/deploy-pages@v4
