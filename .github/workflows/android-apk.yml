name: Build EFGC Youth V90 test APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "scripts/restore-mobile-brand-assets.py"
      - "assets-src/v73/**"
      - "assets-src/v74/logo.part*"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout EFGC Youth V90
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (skip the retired tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore and validate full EFGC emblem and welcome poster
        run: python3 scripts/restore-mobile-brand-assets.py

      - name: Decode authentic EFGC artwork fully before Android packaging
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python3 - <<'PY'
          from PIL import Image
          for file in ("assets/v74-login-poster.webp","assets/v74-efgc-logo.webp"):
              with Image.open(file) as image:
                  image.load()
                  assert image.width >= 400 and image.height >= 400, (file,image.size)
                  print("Android image PASS:",file,image.size)
          PY

      - name: Add the authentic rebuilt EFGC emblem as the APK icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/v74-efgc-logo.webp android/app/src/main/res/drawable/efgc_logo.webp
          test -s android/app/src/main/res/drawable/efgc_logo.webp

      - name: Assemble the Android test APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify and fingerprint the APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload EFGC Youth test APK
        uses: actions/upload-artifact@v4
        with:
          name: EFGC-Youth-V90-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
