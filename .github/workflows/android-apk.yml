name: Build EFGC Youth Android test APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "scripts/prepare-mobile-web.mjs"
      - ".github/workflows/android-apk.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate official EFGC artwork and offline Scripture images
        run: |
          python -m pip install --quiet pillow
          python scripts/build-v74-assets.py
          python scripts/build-login-art.py

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and stage website assets
        run: npm run mobile:prepare

      - name: Generate native Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Compile Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: EFGC-Youth-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
