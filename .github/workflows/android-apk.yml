name: Build EFGC Youth V88 test APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout EFGC Youth V88
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Add the authentic committed EFGC emblem as the APK icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/v74-efgc-logo.webp android/app/src/main/res/drawable/efgc_logo.webp
          test -s android/app/src/main/res/drawable/efgc_logo.webp

      - name: Assemble the Android test APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify and fingerprint the APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload EFGC Youth test APK
        uses: actions/upload-artifact@v4
        with:
          name: EFGC-Youth-V88-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
